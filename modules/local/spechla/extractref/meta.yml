name: spechla_extractref
description: Copy the bundled HLA read-collection reference FASTA out of the SpecHLA container
keywords:
  - hla
  - reference
  - spechla
tools:
  - spechla:
      description: SpecHLA enables full-resolution HLA typing and HLA LOH detection from sequencing data.
      homepage: https://github.com/deepomicslab/SpecHLA
      documentation: https://github.com/deepomicslab/SpecHLA/blob/master/README.MD
      tool_dev_url: https://github.com/deepomicslab/SpecHLA
      doi: 10.1016/j.crmeth.2023.100589
      licence: ["MIT"]
input:
  - ready:
      type: boolean
      description: |
        Trivial trigger value. The module takes no data input and runs once per
        pipeline run; the value carries no meaning beyond firing the process.
output:
  - fasta:
      type: file
      description: SpecHLA's bundled whole-gene HLA reference covering all 8 loci
      pattern: "hla_gen.format.filter.extend.DRB.no26789.v2.fasta"
authors:
  - "@jonasscheid"
