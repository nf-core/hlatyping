name: spechla_typing
description: Full-resolution HLA typing from paired-end short-read sequencing data using SpecHLA.
keywords:
  - hla
  - typing
  - mhc
  - immunology
tools:
  - spechla:
      description: SpecHLA enables full-resolution HLA typing and HLA LOH detection from sequencing data.
      homepage: https://github.com/deepomicslab/SpecHLA
      documentation: https://github.com/deepomicslab/SpecHLA/blob/master/README.MD
      tool_dev_url: https://github.com/deepomicslab/SpecHLA
      doi: 10.1016/j.crmeth.2023.100589
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
        e.g. [ id:'sample1', single_end:false, seq_type:'dna' ]
  - reads:
      type: list
      description: List of two paired-end FASTQ files (must be paired-end)
      pattern: "*.{fq,fastq}.gz"
output:
  - hla_type:
      type: file
      description: Final HLA typing call (one row per locus, 4-field resolution)
      pattern: "hla.result.txt"
  - details:
      type: file
      description: All candidate alleles with mapping scores
      pattern: "hla.result.details.txt"
  - g_group:
      type: file
      description: G-group resolution call
      pattern: "hla.result.g.group.txt"
  - phased_vcfs:
      type: file
      description: Per-locus phased VCFs
      pattern: "HLA_*.rephase.vcf.gz"
  - alleles_fasta:
      type: file
      description: Reconstructed full-allele sequences (low-depth regions masked with N)
      pattern: "hla.allele.*.HLA_*.fasta"
  - freq:
      type: file
      description: Per-locus haplotype frequencies
      pattern: "HLA_*_freq.txt"
  - versions_spechla:
      type: file
      description: Topic-channel version emission
authors:
  - "@jonasscheid"
